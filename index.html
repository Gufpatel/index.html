<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Vaidehi Cinema...</title>

    <!-- Open Graph Tags for WhatsApp & Facebook Previews -->
    <meta property="og:title" content="Download Vaidehi Cinema">
    <meta property="og:description" content="Click here to securely download the latest Vaidehi Cinema app directly to your Android device.">
    <meta property="og:image" content="https://gufpatel.github.io/index.html/logo.png">
    <meta property="og:url" content="https://gufpatel.github.io/index.html/">
    <meta property="og:type" content="website">

    <style>
        /* CSS Reset for consistent cross-browser rendering */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- GLOBAL VARIABLES & THEME --- */
        :root {
            --dark-metal-bg: #111111;
            --main-gold: #C4A05E; 
            --light-tan: #E7D7A0; 
            --button-gold-dark: #9A8045;
            --button-gold-light: #F0DA9B;
            --help-box-bg: rgba(255, 255, 255, 0.05); /* Darkened the help box */
            --help-box-red: #E74C3C;
            --main-font: 'system-ui', '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            /* Complex stacked gradients for brushed metal effect */
            background: 
                /* 1. The sweeping light highlights (Conic) */
                conic-gradient(
                    from 45deg at 50% 50%, 
                    rgba(255, 255, 255, 0.05) 0deg, 
                    rgba(255, 255, 255, 0) 45deg, 
                    rgba(255, 255, 255, 0.15) 135deg, 
                    rgba(255, 255, 255, 0) 225deg, 
                    rgba(255, 255, 255, 0.05) 315deg, 
                    rgba(255, 255, 255, 0.05) 360deg
                ),
                /* 2. The fine circular brushed texture (Repeating Radial) */
                repeating-radial-gradient(
                    circle at 50% 50%, 
                    transparent 0, 
                    transparent 2px, 
                    rgba(0, 0, 0, 0.05) 2px, 
                    rgba(0, 0, 0, 0.05) 4px
                ),
                /* 3. The fine sweeping lines (Repeating Conic) */
                repeating-conic-gradient(
                    from 0deg at 50% 50%,
                    transparent 0deg,
                    transparent 0.5deg,
                    rgba(0, 0, 0, 0.1) 0.5deg,
                    rgba(0, 0, 0, 0.1) 1deg
                ),
                /* 4. The base dark metal gradient (Radial) */
                radial-gradient(circle at 50% 50%, #2a2a2a 0%, #050505 100%);
            
            font-family: var(--main-font);
            color: var(--light-tan);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden; 
            text-align: center;
        }

        /* --- CONTAINER --- */
        .page-container {
            width: 100%;
            max-width: 480px; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- LOGO IMAGE --- */
        .logo {
            width: 200px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            margin-bottom: 30px;
            /* Added a subtle gold border to frame the image nicely */
            border: 2px solid rgba(196, 160, 94, 0.3); 
        }

        /* --- MAIN TITLE --- */
        .main-title {
            color: var(--main-gold);
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: capitalize;
            /* Multi-layered text shadows to create bevel and 3D depth */
            text-shadow:
                1px 1px 0 #000,
                -1px -1px 0 rgba(255,255,255,0.2),
                2px 2px 5px rgba(0,0,0,0.8);
        }

        /* --- SUB-TEXT --- */
        .sub-text {
            color: var(--light-tan);
            font-size: 18px;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
            padding: 0 10px;
        }

                /* --- CTA BUTTON (True 3D Layer Bevel) --- */
        .cta-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            padding: 18px 30px;
            border-radius: 14px;
            margin-bottom: 40px; 
            
            /* 1. The Outer Raised Rim */
            background: linear-gradient(180deg, #FDE6A9 0%, #B28834 100%);
            border: 1px solid #1a1205; /* Sharp dark edge */
            box-shadow: 
                0px 10px 25px rgba(0, 0, 0, 0.8), /* Heavy drop shadow */
                inset 0px 2px 2px rgba(255,255,255,0.9); /* Sharp top rim highlight */
            transition: all 0.1s ease;
        }

        /* 2. The Inner Recessed Area */
        .cta-button::before {
            content: "";
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px; /* Creates the 5px outer rim */
            border-radius: 9px; 
            background: linear-gradient(180deg, #C2983C 0%, #A57A22 100%); /* Slightly darker */
            box-shadow: 
                inset 0px 4px 6px rgba(0, 0, 0, 0.5), /* Inner shadow for depth */
                inset 0px -2px 3px rgba(255, 255, 255, 0.2); /* Bottom inner bounce light */
            z-index: 1; /* Places it above the outer rim */
        }

        /* 3. Text and Icon Layering */
        .button-text, .download-icon {
            position: relative;
            z-index: 2; /* Forces text to sit on top of the recessed area */
            color: #1a1a1a;
            font-family: var(--main-font);
            font-size: 22px;
            font-weight: 800;
            text-transform: capitalize;
            text-shadow: 0px 1px 1px rgba(255,255,255,0.3); /* Engraved text effect */
        }

        .cta-button:active {
            transform: translateY(4px); /* Pushes button down */
            box-shadow: 
                0px 4px 10px rgba(0, 0, 0, 0.8), 
                inset 0px 2px 2px rgba(255,255,255,0.9);
        }


        /* Download Icon in Button */
        .download-icon {
            margin-left: 12px; 
            width: 20px;
            height: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Icon parts */
        .download-icon::before { /* Downward arrow shaft */
            content: "";
            width: 3px;
            height: 14px;
            background-color: #1a1a1a;
            position: absolute;
            bottom: 4px;
        }
        .download-icon::after { /* Bottom line */
            content: "";
            width: 16px;
            height: 3px;
            background-color: #1a1a1a;
            position: absolute;
            bottom: 0px;
            border-radius: 2px;
        }
        .download-arrowhead {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #1a1a1a;
            position: absolute;
            bottom: 2px;
        }

        /* --- HELP BOX --- */
        .help-box {
            display: none; /* Hidden by default, script reveals it */
            background-color: var(--help-box-bg);
            border: 1px solid var(--help-box-red);
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.2); /* Soft red glow */
        }

        .help-text {
            color: #ddd; /* Lighter text for readability on dark bg */
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
        }
        
        .help-text strong {
            color: white;
            font-weight: 700;
        }

    </style>
</head>
<body>

    <div class="page-container">

        <!-- LOGO IMAGE: Uses your raw GitHub link -->
        <img src="https://gufpatel.github.io/index.html/logo.png?v=2" alt="Vaidehi Cinema Logo" class="logo">


        <!-- Main Title -->
        <h1 class="main-title">Vaidehi Cinema</h1>

        <!-- Sub-text -->
        <p class="sub-text">Click below to safely download the Vaidehi Cinema app.</p>

        <!-- CTA Button -->
        <a id="downloadBtn" href="#" class="cta-button">
            <span class="button-text">Download App Now</span>
            <span class="download-icon">
                <span class="download-arrowhead"></span>
            </span>
        </a>

        <!-- Help Box (Fallback Message) -->
        <div id="fallbackMessage" class="help-box">
            <p class="help-text">
                If the button doesn't work, tap the three dots above and select '<strong>Open in Chrome</strong>'.
            </p>
        </div>

    </div>

    <!-- The exact script you were using to detect Instagram -->
    <script>
        const apkPath = "github.com/Gufpatel/Vaidehi-Cinema/releases/download/VC/Vaidehi.Cinema.apk";
        const standardUrl = "https://" + apkPath;
        const intentUrl = "intent://" + apkPath + "#Intent;scheme=https;action=android.intent.action.VIEW;package=com.android.chrome;end;";

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInstagram = (ua.indexOf('Instagram') > -1);
        const isFacebook = (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);
        const isAndroid = (ua.indexOf('Android') > -1);

        const btn = document.getElementById('downloadBtn');

        if (isAndroid && (isInstagram || isFacebook)) {
            // Setup the button for Instagram/Facebook
            btn.href = intentUrl;
            
            // Show the fallback message immediately as a backup instruction
            document.getElementById('fallbackMessage').style.display = 'block';
        } else {
            // Setup for normal browsers
            btn.href = standardUrl;
            window.location.href = standardUrl; // Auto-redirect is safe outside Meta apps
        }
    </script>
</body>
</html>
