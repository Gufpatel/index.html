<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0b">
<title>Vaidehi Cinema</title>

<!-- Open Graph Tags for WhatsApp & Facebook Previews -->
<meta property="og:title" content="Download Vaidehi Cinema">
<meta property="og:description" content="Click here to securely download the latest Vaidehi Cinema app directly to your Android device.">
<meta property="og:image" content="https://gufpatel.github.io/index.html/logo.png?v=2">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --gold:#d9ad50;
    --lightgold:#ffe8a4;
    --darkgold:#6d4b16;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#08090a;
}

.background{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(180,140,55,.20),
            transparent 35%
        ),
        repeating-radial-gradient(
            circle at center,
            rgba(255,255,255,.025) 0,
            rgba(255,255,255,.025) 1px,
            transparent 2px,
            transparent 5px
        ),
        linear-gradient(
            135deg,
            #080909,
            #171714,
            #090a0a
        );
}

.background:before{
    content:"";
    position:absolute;
    width:180%;
    height:180%;
    left:-40%;
    top:-40%;
    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,215,120,.07) 40deg,
            transparent 85deg,
            rgba(255,215,120,.05) 170deg,
            transparent 230deg,
            rgba(255,215,120,.06) 310deg,
            transparent 360deg
        );
    animation:bgRotate 28s linear infinite;
}

.background:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            115deg,
            transparent 0%,
            rgba(255,255,255,.025) 35%,
            transparent 50%,
            rgba(255,255,255,.02) 70%,
            transparent 100%
        );
    background-size:300% 300%;
    animation:bgLight 8s linear infinite;
}

@keyframes bgRotate{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
}

@keyframes bgLight{
    0%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
}

.particles{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
}

.particle{
    position:absolute;
    border-radius:50%;
    background:#ffe4a2;
    box-shadow:
        0 0 5px #e2b457,
        0 0 14px rgba(235,188,88,.8);
    animation:particleUp linear infinite;
}

@keyframes particleUp{
    0%{ transform:translate3d(0,110vh,0) scale(.3); opacity:0; }
    10%{ opacity:.9; }
    50%{ opacity:1; }
    90%{ opacity:.7; }
    100%{ transform:translate3d(70px,-15vh,0) scale(1.2); opacity:0; }
}

.stage{
    position:relative;
    z-index:5;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:10px 7px 30px;
}

.card{
    position:relative;
    width:100%;
    max-width:620px;
    min-height:calc(100vh - 20px);
    padding:25px 12px 30px;
    text-align:center;
    overflow:hidden;
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.015)
        ),
        #111212;
    border:1px solid rgba(232,194,104,.30);
    box-shadow:
        0 30px 80px rgba(0,0,0,.85),
        inset 0 1px 1px rgba(255,255,255,.13),
        inset 0 -20px 45px rgba(0,0,0,.45);
    transform:perspective(1400px) rotateX(0deg) rotateY(0deg);
    transition:transform .15s ease;
}

.card:before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:25px;
    pointer-events:none;
    background:
        linear-gradient(
            115deg,
            transparent 20%,
            rgba(255,220,150,.07) 43%,
            transparent 53%
        );
    background-size:250% 250%;
    animation:cardReflection 7s linear infinite;
}

@keyframes cardReflection{
    0%{ background-position:120% 0; }
    100%{ background-position:-120% 100%; }
}

.light{
    position:absolute;
    width:330px;
    height:330px;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,210,110,.14),
            transparent 68%
        );
    filter:blur(25px);
    pointer-events:none;
}

.light.one{
    top:-180px;
    left:-170px;
}

.light.two{
    right:-180px;
    bottom:-180px;
}

.reflection{
    position:absolute;
    width:140%;
    height:130px;
    left:-20%;
    top:5%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.035),
            transparent
        );
    transform:rotate(-15deg);
    filter:blur(5px);
    pointer-events:none;
    animation:reflectionMove 6s linear infinite;
}

@keyframes reflectionMove{
    0%{ transform:translateX(-100%) rotate(-15deg); }
    100%{ transform:translateX(100%) rotate(-15deg); }
}

.logo-wrapper{
    position:relative;
    width:230px;
    height:230px;
    margin:0 auto 8px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-wrapper:before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:30px;
    background:
        radial-gradient(
            circle,
            rgba(226,180,78,.32),
            transparent 68%
        );
    filter:blur(25px);
    animation:logoAura 3s ease-in-out infinite alternate;
}

.logo-wrapper:after{
    content:"";
    position:absolute;
    width:210px;
    height:210px;
    border-radius:30px;
    border:1px solid rgba(255,218,135,.18);
    box-shadow:
        0 0 25px rgba(222,175,73,.12),
        inset 0 0 20px rgba(255,220,140,.05);
    pointer-events:none;
}

@keyframes logoAura{
    0%{ transform:scale(.88); opacity:.5; }
    100%{ transform:scale(1.08); opacity:1; }
}

.logo{
    position:relative;
    z-index:3;
    width:205px;
    height:205px;
    object-fit:contain;
    border-radius:27px;
    filter:
        drop-shadow(0 15px 14px rgba(0,0,0,.9))
        drop-shadow(0 0 18px rgba(255,210,110,.3));
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{ transform:translateY(0) translateZ(20px); }
    50%{ transform:translateY(-7px) translateZ(40px); }
}

/* --- UPDATED SHINY GOLD POPPING TITLE --- */
.title {
    position: relative;
    z-index: 3;
    width: 100%;
    white-space: nowrap;
    font-size: clamp(37px, 9.5vw, 58px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0px;
    margin: 0 auto;
    color: #FFDF73; 
    text-shadow:
        -1px -1px 0 rgba(255, 255, 255, 0.6), 
        1px 1px 0 #B5841D, 
        2px 2px 0 #A17519, 
        3px 3px 0 #8E6716, 
        4px 4px 0 #7A5812, 
        5px 5px 0 #674A0F, 
        6px 6px 0 #543D0C, 
        8px 8px 15px rgba(0, 0, 0, 0.95); 
    animation: titlePop 3s ease-in-out infinite alternate;
}

@keyframes titlePop {
    0% {
        transform: translateY(0px);
        filter: drop-shadow(0 0 5px rgba(255, 223, 115, 0.2));
    }
    100% {
        transform: translateY(-4px);
        filter: drop-shadow(0 0 18px rgba(255, 223, 115, 0.5));
    }
}
/* -------------------------------------- */

.subtitle{
    position:relative;
    z-index:3;
    width:94%;
    max-width:550px;
    margin:23px auto 29px;
    font-size:clamp(17px,4.5vw,23px);
    line-height:1.45;
    color:#f3dfaa;
    text-shadow:
        0 2px 6px rgba(0,0,0,.95);
}

.download-button{
    position:relative;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    width:94%;
    max-width:545px;
    height:82px;
    margin:0 auto;
    border-radius:21px;
    cursor:pointer;
    text-decoration:none;
    overflow:hidden;
    white-space:nowrap;
    color:#050505;
    font-size:clamp(21px,5.7vw,30px);
    font-weight:900;
    background:
        linear-gradient(
            180deg,
            #fff3c4 0%,
            #f0ce77 18%,
            #c38f3b 52%,
            #e8c06a 80%,
            #fff0b6 100%
        );
    border:2px solid #ffe7a4;
    box-shadow:
        0 7px 0 #684b18,
        0 13px 25px rgba(0,0,0,.8),
        0 0 38px rgba(230,180,70,.3),
        inset 0 3px 5px rgba(255,255,255,.95),
        inset 0 -9px 15px rgba(80,50,10,.35);
    transition:
        transform .16s ease,
        box-shadow .16s ease;
}

.download-button:before{
    content:"";
    position:absolute;
    top:-120%;
    left:-50%;
    width:35%;
    height:340%;
    transform:rotate(25deg);
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.85),
            transparent
        );
    animation:buttonShine 3.5s ease-in-out infinite;
}

@keyframes buttonShine{
    0%{ left:-55%; }
    45%,100%{ left:145%; }
}

.download-button:hover{
    transform:translateY(-5px) scale(1.012);
    box-shadow:
        0 12px 0 #684b18,
        0 22px 38px rgba(0,0,0,.9),
        0 0 60px rgba(235,190,85,.5),
        inset 0 3px 6px white;
}

.download-button:active{
    transform:translateY(5px);
    box-shadow:
        0 2px 0 #684b18,
        0 8px 15px rgba(0,0,0,.8),
        inset 0 4px 10px rgba(0,0,0,.25);
}

.download-icon{
    width:34px;
    height:34px;
    flex-shrink:0;
    fill:#050505;
}

.notice{
    position:relative;
    z-index:3;
    width:94%;
    max-width:545px;
    margin:37px auto 0;
    padding:19px 17px;
    border-radius:20px;
    border:2px solid rgba(184,55,47,.9);
    background:
        linear-gradient(
            145deg,
            rgba(105,27,22,.38),
            rgba(30,8,8,.75)
        );
    box-shadow:
        inset 0 0 25px rgba(255,50,40,.06),
        0 12px 30px rgba(0,0,0,.55);
    color:#f0ddb0;
    font-size:clamp(14px,4vw,18px);
    line-height:1.5;
    text-shadow:0 2px 5px #000;
}

.notice strong{
    color:#ffdf96;
}

.footer{
    position:relative;
    z-index:3;
    margin-top:25px;
    color:rgba(255,255,255,.4);
    font-size:12px;
}

@media(max-width:500px){
    .stage{ padding:6px 5px 25px; }
    .card{
        min-height:calc(100vh - 12px);
        padding:20px 8px 28px;
        border-radius:22px;
    }
    .logo-wrapper{
        width:205px;
        height:205px;
        margin-bottom:6px;
    }
    .logo{ width:182px; height:182px; }
    .logo-wrapper:after{ width:188px; height:188px; }
    .title{
        font-size:40px;
        letter-spacing:0px; /* Fixed spacing */
    }
    .subtitle{
        width:95%;
        font-size:18px;
        margin:21px auto 28px;
    }
    .download-button{
        width:94%;
        height:78px;
        font-size:22px;
        gap:10px;
        border-radius:20px;
    }
    .download-icon{ width:31px; height:31px; }
    .notice{
        width:94%;
        margin-top:34px;
        padding:18px 13px;
        font-size:15px;
    }
    .footer{ margin-top:24px; }
}

@media(max-width:380px){
    .logo-wrapper{ width:175px; height:175px; }
    .logo{ width:155px; height:155px; }
    .logo-wrapper:after{ width:163px; height:163px; }
    .title{ font-size:34px; letter-spacing:0px; }
    .subtitle{ font-size:16px; margin-top:18px; }
    .download-button{ height:70px; font-size:19px; }
    .download-icon{ width:28px; height:28px; }
    .notice{ font-size:14px; margin-top:30px; }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="particles" id="particles"></div>

<div class="stage">

<main class="card" id="card">

<div class="light one"></div>

<div class="light two"></div>

<div class="reflection"></div>

<div class="logo-wrapper">

<img
src="logo.png?v=2"
alt="Vaidehi Cinema"
class="logo"
id="logo">

</div>

<h1 class="title">
Vaidehi Cinema
</h1>

<p class="subtitle">
Click below to safely download
the Vaidehi Cinema app.
</p>

<a
href="#"
class="download-button"
id="downloadButton"
download>

<span>
Download App Now
</span>

<svg
class="download-icon"
viewBox="0 0 24 24">

<path d="M12 3v11.17l3.59-3.58L17 12l-5 5-5-5 1.41-1.41L11 14.17V3h1zm-7 16h14v2H5v-2z"/>

</svg>

</a>

<div class="notice">

If the button doesn't work,
tap the <strong>three dots ⋮</strong> above and
select <strong>"Open in Chrome"</strong>.

</div>

<div class="footer">
© 2026 Vaidehi Cinema · Official App
</div>

</main>

</div>

<script>
// 1. Floating Background Particles
const particles = document.getElementById("particles");
for(let i=0; i<45; i++) {
    const p = document.createElement("span");
    p.className = "particle";
    const size = Math.random() * 3 + 1;
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (Math.random() * 8 + 7) + "s";
    p.style.animationDelay = (Math.random() * -15) + "s";
    particles.appendChild(p);
}

// 2. Button Click Particle Burst
const button = document.getElementById("downloadButton");
button.addEventListener("click", function(e) {
    for(let i=0; i<25; i++) {
        const spark = document.createElement("span");
        spark.style.position = "fixed";
        spark.style.width = "5px";
        spark.style.height = "5px";
        spark.style.borderRadius = "50%";
        spark.style.background = "#ffe7a0";
        spark.style.boxShadow = "0 0 15px #e0ae45";
        spark.style.left = e.clientX + "px";
        spark.style.top = e.clientY + "px";
        spark.style.zIndex = "99999";
        document.body.appendChild(spark);

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 100 + 40;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        spark.animate([
            { transform: "translate(0,0) scale(1)", opacity: 1 },
            { transform: "translate(" + x + "px," + y + "px) scale(0)", opacity: 0 }
        ], {
            duration: 750,
            easing: "cubic-bezier(.2,.8,.2,1)"
        });

        setTimeout(function(){ spark.remove(); }, 800);
    }
});

// 3. Instagram / Facebook Browser Redirect
const apkPath = "github.com/Gufpatel/Vaidehi-Cinema/releases/download/VC/vaidehi.cinema.apk";
const standardUrl = "https://" + apkPath;
const intentUrl = "intent://" + apkPath + "#Intent;scheme=https;action=android.intent.action.VIEW;package=com.android.chrome;end;";

const ua = navigator.userAgent || navigator.vendor || window.opera;
const isInstagram = (ua.indexOf('Instagram') > -1);
const isFacebook = (ua.indexOf('FBAN') > -1) || (ua.indexOf('FBAV') > -1);
const isAndroid = (ua.indexOf('Android') > -1);

if (isAndroid && (isInstagram || isFacebook)) {
    button.href = intentUrl;
} else {
    button.href = standardUrl;
}
</script>

</body>
</html>
